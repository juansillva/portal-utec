
services:
  postgres:
    image: postgres:16
    container_name: uconnect_postgres 
    restart: always 
    ports:  
     - "5433:5432"
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: uconnect_pgadmin
    restart: always
    ports: 
      - "5050:80"
    environment: 
      PGADMIN_DEFAULT_EMAIL: juandev@utec.com
      PGADMIN_DEFAULT_PASSWORD: 1603ANju$
    depends_on: 
      - postgres

volumes:
  postgres_data:
